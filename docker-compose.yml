services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    hostname: ${NAPCAT_HOSTNAME:-fish-qq}
    restart: always
    entrypoint: ["bash", "/app/fish/napcat-entrypoint.sh"]
    ports:
      - "${NAPCAT_BIND_HOST:-127.0.0.1}:6099:6099" # WebUI 登录
      - "${NAPCAT_BIND_HOST:-127.0.0.1}:3001:3001" # 宿主机 Bot 调试
    environment:
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
      ACCOUNT: ${NAPCAT_ACCOUNT:-} # 首次扫码后，使用已保存的账号快速登录
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:?请在 .env 设置 ONEBOT_ACCESS_TOKEN}
    volumes:
      - ./napcat/QQ:/app/.config/QQ         # QQ 登录数据；会话有效时可快速登录
      - ./napcat/config:/app/napcat/config  # NapCat 配置持久化
      - ./scripts:/app/fish:ro             # 启动前固定 machine-id、初始化正向 WS

  # bot-core：与 napcat 同编排，容器网络内以服务名互连；管理网站仅映射到宿主回环地址
  bot:
    build: .
    container_name: big-fat-fish
    restart: always
    depends_on:
      - napcat          # 只保证启动顺序；napcat 就绪慢无妨，bot 断线 5s 自动重连兜底
    environment:
      # 覆盖 .env 里的 localhost（compose 的 environment 优先级高于 env_file）：
      # 容器网络内经服务名访问 napcat
      ONEBOT_WS_URL: ws://napcat:3001
      # 时区：日志与记忆条目时间戳取本地时区（Node 内置 ICU 支持时区，无需安装 tzdata）
      TZ: Asia/Shanghai
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: ${ADMIN_PORT:-3210}
    ports:
      - "127.0.0.1:${ADMIN_PUBLISH_PORT:-${ADMIN_PORT:-3210}}:${ADMIN_PORT:-3210}"
    env_file:
      - .env            # 其余配置（token / LLM key / 管理白名单等）与宿主机同源
    volumes:
      - ./data:/app/data            # 全部运行时数据（含 media/generated 原图与 media/memes 表情包）
      - type: bind
        source: ./config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
