services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    ports:
      - "6099:6099"   # WebUI：扫码登录 / 配置网络
      - "3001:3001"   # OneBot 11 正向 WebSocket（Bot 连接入口）
    environment:
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
      # ACCOUNT: "123456"   # QQ 号：首次扫码登录后可打开，实现重启自动登录
    volumes:
      - ./napcat/QQ:/app/.config/QQ         # QQ 登录态持久化（重启免扫码）
      - ./napcat/config:/app/napcat/config  # NapCat 配置持久化

  # bot-core（容器化后加入本编排；开发期直接宿主机 node 运行）
